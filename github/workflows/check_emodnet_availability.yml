name: EMODnet Service Monitor

on:
  schedule:
    # Executa a cada 30 minutos (ajuste conforme necessário)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite disparar o teste manualmente pelo botão no GitHub Actions

jobs:
  check-service:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera a execução aproveitando o cache das dependências

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar monitoramento
        env:
          # Segredo cadastrado no repositório (Settings > Secrets and variables > Actions)
          EMODNET_DISCORD_WEBHOOK_URL: ${{ secrets.EMODNET_DISCORD_WEBHOOK_URL }}
          
          # Variáveis opcionais (se quiser sobrescrever os valores padrão do código)
          # EMODNET_MONITOR_URL: "https://monitor.emodnet.eu/resource/55/json"
          # EMODNET_REQUEST_TIMEOUT: "10"
        run: python check_emodnet_availability.py