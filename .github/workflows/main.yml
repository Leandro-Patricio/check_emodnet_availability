name: EMODnet Service Monitor

on:
# keep comment for future reference if we want to schedule the workflow to run every 30 minutes
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-service:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Config Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute monitoring
        env:
          EMODNET_DISCORD_WEBHOOK_URL: ${{ secrets.EMODNET_DISCORD_WEBHOOK_URL }}
        run: python check_emodnet_availability.py

      - name: Persist historic on repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update monitoring history" && git push)
