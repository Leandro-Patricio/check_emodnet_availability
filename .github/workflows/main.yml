name: EMODnet Service Monitor

on:
# keep comment for future reference if we want to schedule the workflow to run every 30 minutes
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-service:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar monitoramento
        env:
          EMODNET_DISCORD_WEBHOOK_URL: ${{ secrets.EMODNET_DISCORD_WEBHOOK_URL }}
        run: python check_emodnet_availability.py
