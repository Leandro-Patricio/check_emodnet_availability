<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMODnet Service Status Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 950px;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .metric {
      font-size: 1.1rem;
      color: #94a3b8;
    }
    .uptime-val {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.4rem;
    }
    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2 style="margin: 0 0 6px 0;">EMODnet Service Availability</h2>
        <span style="color: #64748b; font-size: 0.9rem;">Window: Last 7 days</span>
      </div>
      <div class="metric">
        Uptime: <span id="uptime-val" class="uptime-val">--%</span> (<span id="runs-count">--</span> runs)
      </div>
    </div>
    <div id="loading">Loading data...</div>
    <div class="chart-container" style="display: none;" id="chart-wrapper">
      <canvas id="statusChart"></canvas>
    </div>
  </div>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/Leandro-Patricio/check_emodnet_availability/main/history.json";
    const DAYS = 7;

    async function loadDashboard() {
      try {
        const response = await fetch(DATA_URL + "?nocache=" + new Date().getTime());
        const raw = await response.json();
        const history = Array.isArray(raw) ? raw : (raw.history || []);

        const cutoff = new Date(Date.now() - DAYS * 24 * 60 * 60 * 1000);
        
        const filtered = history.filter(item => {
          if (!item.ts) return false;
          const dt = new Date(item.ts.replace("Z", "+00:00"));
          return dt >= cutoff;
        });

        if (filtered.length === 0) {
          document.getElementById('loading').innerText = "No data found in the last 7 days.";
          return;
        }

        const labels = filtered.map(x => x.ts);
        const overall = filtered.map(x => x.ok ? 1 : 0);
        const monitor = filtered.map(x => (x.tests && x.tests.monitor === true) ? "PASS" : (x.tests && x.tests.monitor) || "FAIL");
        const data = filtered.map(x => (x.tests && x.tests.data === true) ? "PASS" : (x.tests && x.tests.data) || "FAIL");

        const totalRuns = filtered.length;
        const successfulRuns = overall.reduce((a, b) => a + b, 0);
        const uptime = (successfulRuns / totalRuns * 100).toFixed(1);

        document.getElementById('uptime-val').innerText = `${uptime}%`;
        document.getElementById('runs-count').innerText = `${successfulRuns}/${totalRuns}`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('chart-wrapper').style.display = 'block';

        const ctx = document.getElementById('statusChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels.map(t => new Date(t).toLocaleString('en-US', { timeZone: 'UTC' }) + ' UTC'),
            datasets: [{
              label: 'System Status',
              data: overall,
              stepped: true,
              borderColor: '#38bdf8',
              borderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointBackgroundColor: overall.map(v => v === 1 ? '#22c55e' : '#ef4444'),
              fill: true,
              backgroundColor: 'rgba(56, 189, 248, 0.08)'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                min: -0.1,
                max: 1.1,
                ticks: {
                  stepSize: 1,
                  callback: (v) => v === 1 ? 'UP' : (v === 0 ? 'DOWN' : ''),
                  color: '#94a3b8'
                },
                grid: { color: '#334155' }
              },
              x: {
                ticks: { color: '#94a3b8', maxTicksLimit: 10 },
                grid: { display: false }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => ctx.raw === 1 ? 'Overall Status: UP' : 'Overall Status: DOWN',
                  afterBody: (ctx) => {
                    const idx = ctx[0].dataIndex;
                    return [
                      `Monitor: ${monitor[idx]}`,
                      `API Data (cent2): ${data[idx]}`
                    ];
                  }
                }
              }
            }
          }
        });
      } catch (err) {
        document.getElementById('loading').innerText = "Error loading history data: " + err.message;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
